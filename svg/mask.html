<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style></style>
  </head>
  <body>
    <div class="knockout">
      <svg class="knockout-text-container" width="100%" height="100%">
        <rect
          class="knockout-text-bg"
          width="100%"
          height="100%"
          fill="red"
          x="0"
          y="0"
          fill-opacity="1"
          mask="url(#knockout-text)"
        />
        <mask id="knockout-text">
          <!-- <rect width="100%" height="100%" fill="#000" x="0" y="0" /> -->
          <!-- 蒙板 白色显示底色，黑色不显示 -->
          <text x="50%" y="50%" fill="#00f" text-anchor="middle">
            Knock Out Text
          </text>
          <circle cx="25" cy="25" r="25" style="stroke: none; fill: #ffffff" />
        </mask>
      </svg>
    </div>
  </body>
</html>
