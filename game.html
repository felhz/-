<!DOCTYPE html>
<html>
  <head>
    <title>贪吃蛇游戏</title>
    <style>
      #gameCanvas {
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <script>
      // 初始化游戏画布
      const canvas = document.getElementById("gameCanvas");
    
      const ctx = canvas.getContext("2d");

      // 定义蛇的初始属性
      let snake = [
        { x: 200, y: 200 },
        { x: 190, y: 200 },
        { x: 180, y: 200 },
      ];

      // 食物位置
      let food = {
        x: Math.floor(Math.random() * 40) * 10,
        y: Math.floor(Math.random() * 40) * 10,
      };

      // 移动方向
      let dx = 10;
      let dy = 0;

      // 游戏主循环
      function gameLoop() {
        setTimeout(function () {
          clearCanvas();
          moveSnake();
          drawFood();
          drawSnake();

          // 检测碰撞
          if (checkCollision()) {
            alert("游戏结束！");
            return;
          }

          // 检测是否吃到食物
          if (snake[0].x === food.x && snake[0].y === food.y) {
            // 生成新食物
            food = {
              x: Math.floor(Math.random() * 40) * 10,
              y: Math.floor(Math.random() * 40) * 10,
            };
          } else {
            snake.pop();
          }

          gameLoop();
        }, 100);
      }

      // 清空画布
      function clearCanvas() {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 绘制蛇
      function drawSnake() {
        ctx.fillStyle = "green";
        snake.forEach((segment) => {
          ctx.fillRect(segment.x, segment.y, 10, 10);
        });
      }

      // 绘制食物
      function drawFood() {
        ctx.fillStyle = "red";
        ctx.fillRect(food.x, food.y, 10, 10);
      }

      // 移动蛇
      function moveSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);
      }

      // 检测碰撞
      function checkCollision() {
        const head = snake[0];

        // 检测是否撞墙
        if (
          head.x < 0 ||
          head.x >= canvas.width ||
          head.y < 0 ||
          head.y >= canvas.height
        ) {
          return true;
        }

        // 检测是否撞到自己
        for (let i = 1; i < snake.length; i++) {
          if (head.x === snake[i].x && head.y === snake[i].y) {
            return true;
          }
        }

        return false;
      }

      // 键盘控制
      document.addEventListener("keydown", function (event) {
        switch (event.key) {
          case "ArrowLeft":
            if (dx === 0) {
              dx = -10;
              dy = 0;
            }
            break;
          case "ArrowRight":
            if (dx === 0) {
              dx = 10;
              dy = 0;
            }
            break;
          case "ArrowUp":
            if (dy === 0) {
              dx = 0;
              dy = -10;
            }
            break;
          case "ArrowDown":
            if (dy === 0) {
              dx = 0;
              dy = 10;
            }
            break;
        }
      });

      // 开始游戏
      gameLoop();
    </script>
  </body>
</html>
