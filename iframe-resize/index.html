<style>
  iframe {
    width: 100%;
    height: 50vh;
    margin-top: 200px;
  }
</style>
<script
  src="./iframeResizer.js"
  type="text/javascript"
  
></script>
<iframe id="myIframe" src="http://127.0.0.1:5500/child.html"></iframe>
<script>
  
 const iframes =  window.iFrameResize(
    {
      // log: true, // Enable
      inPageLinks: true,
      bodyBackground: "rgb(245, 249, 255)",
      autoResize: true,
      minHeight: "470px",
      waitForLoad: true,
      onMouseEnter() {
        console.log("mouseenter");
        iframes[0].iFrameResizer.sendMessage("hello")
      },
      onMessage(e){
        console.log('接受到消息',e);
      }
    },
    "#myIframe"
  );
  console.log(iframes);
  
</script>
